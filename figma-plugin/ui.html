<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gazetkowo Preview</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        min-width: 320px;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #18a0fb;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="close">Close plugin</button>
    <script>
      document.getElementById('close').addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
      });
    </script>
  </body>
</html>
